<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор Демотиваторов</title>
<link rel="icon" id="favicon" type="image/png" href="">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5.0.8/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5.0.8/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5.0.8/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5.0.8/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.0.8/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/bebas-neue@5.0.8/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lobster@5.0.8/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5.0.8/700.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f14;
    --panel: #1a1a24;
    --panel-2: #23232f;
    --border: #2e2e3d;
    --text: #e8e8f0;
    --muted: #8a8aa0;
    --accent: #ff4757;
    --accent-2: #ffa502;
  }
  body {
    font-family: 'Roboto', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  header { text-align: center; margin-bottom: 24px; }
  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
  .app {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }
  .panel h2 {
    font-size: 1rem;
    margin-bottom: 14px;
    color: var(--accent-2);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .group { margin-bottom: 18px; }
  .group label {
    display: block;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input[type="text"], select, input[type="number"] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus, select:focus, input[type="number"]:focus {
    border-color: var(--accent);
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 16px;
    border-radius: 8px;
    border: none;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    width: 100%;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #ff6b81);
    color: #fff;
    box-shadow: 0 4px 14px rgba(255,71,87,0.35);
  }
  .btn-secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-accent {
    background: linear-gradient(135deg, var(--accent-2), #ffbe42);
    color: #1a1a24;
    box-shadow: 0 4px 14px rgba(255,165,2,0.35);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .file-drop {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 22px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .file-drop:hover, .file-drop.drag {
    border-color: var(--accent);
    background: rgba(255,71,87,0.05);
  }
  .file-drop .icon { font-size: 1.8rem; margin-bottom: 6px; }
  .file-drop small { color: var(--muted); font-size: 0.8rem; }
  input[type="file"] { display: none; }

  .preview-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .preview-container {
    width: 100%;
    max-width: 700px;
    background: #000;
    border-radius: 8px;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 300px;
  }
  #demotivator {
    background: #000;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    max-width: 100%;
  }
  #demotivator .frame {
    display: inline-block;
    line-height: 0;
    position: relative;
  }
  #demotivator img {
    display: block;
    max-width: 100%;
    height: auto;
  }

  .dem-title {
    color: #fff;
    text-align: center;
    margin-top: 18px;
    font-weight: 700;
    line-height: 1.1;
    word-wrap: break-word;
    max-width: 100%;
  }
  .dem-sub {
    color: #fff;
    text-align: center;
    margin-top: 8px;
    line-height: 1.2;
    word-wrap: break-word;
    max-width: 100%;
  }

  .crop-area {
    position: relative;
    display: inline-block;
    max-width: 100%;
    user-select: none;
    touch-action: none;
  }
  .crop-area img {
    display: block;
    max-width: 100%;
    height: auto;
    pointer-events: none;
  }
  .crop-box {
    position: absolute;
    border: 2px dashed #fff;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
    cursor: move;
    background: transparent;
  }
  .crop-box .handle {
    position: absolute;
    width: 14px;
    height: 14px;
    background: var(--accent);
    border: 2px solid #fff;
    border-radius: 50%;
  }
  .handle.tl { top: -8px; left: -8px; cursor: nwse-resize; }
  .handle.tr { top: -8px; right: -8px; cursor: nesw-resize; }
  .handle.bl { bottom: -8px; left: -8px; cursor: nesw-resize; }
  .handle.br { bottom: -8px; right: -8px; cursor: nwse-resize; }
  .crop-modal {
    display: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-top: 14px;
  }
  .crop-modal.active { display: block; }
  .crop-actions { display: flex; gap: 10px; margin-top: 12px; }
  .crop-actions .btn { flex: 1; }

  .empty-state {
    color: var(--muted);
    text-align: center;
    padding: 60px 20px;
    font-size: 0.95rem;
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 10px; opacity: 0.5; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: var(--panel-2);
    padding: 4px;
    border-radius: 10px;
  }
  .tab {
    flex: 1;
    padding: 8px;
    text-align: center;
    border-radius: 7px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--muted);
    transition: all 0.2s;
    border: none;
    background: transparent;
    font-family: inherit;
  }
  .tab.active { background: var(--accent); color: #fff; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  @media (max-width: 900px) {
    body { padding: 12px; }
    .app { grid-template-columns: 1fr; }
    header h1 { font-size: 1.8rem; }
    #demotivator { padding: 24px 20px 30px !important; }
  }
</style>
</head>
<body>

<header>
  <h1>ГЕНЕРАТОР ДЕМОТИВАТОРОВ</h1>
  <p>Загрузи картинку — получи шедевр. Всё работает локально в браузере.</p>
</header>

<div class="app">
  <div class="panel">
    <div class="tabs">
      <button class="tab active" data-tab="image">📷 Картинка</button>
      <button class="tab" data-tab="text">✏️ Текст</button>
      <button class="tab" data-tab="style">🎨 Стиль</button>
    </div>

    <div class="tab-content active" id="tab-image">
      <div class="group">
        <label>Загрузить изображение</label>
        <label class="file-drop" id="fileDrop">
          <div class="icon">📁</div>
          <div><strong>Нажми или перетащи файл</strong></div>
          <small>JPG, PNG, WEBP</small>
          <input type="file" id="fileInput" accept="image/*">
        </label>
      </div>

      <div class="group">
        <label>Кадрирование</label>
        <button class="btn btn-secondary" id="openCropBtn" disabled>✂️ Открыть кадрирование</button>
        <div class="crop-modal" id="cropModal">
          <div class="crop-area" id="cropArea">
            <img id="cropImg" src="" alt="">
            <div class="crop-box" id="cropBox">
              <div class="handle tl" data-handle="tl"></div>
              <div class="handle tr" data-handle="tr"></div>
              <div class="handle bl" data-handle="bl"></div>
              <div class="handle br" data-handle="br"></div>
            </div>
          </div>
          <div class="crop-actions">
            <button class="btn btn-primary" id="applyCropBtn">Применить</button>
            <button class="btn btn-secondary" id="resetCropBtn">Сброс</button>
            <button class="btn btn-secondary" id="closeCropBtn">Закрыть</button>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-text">
      <div class="group">
        <label>Заголовок</label>
        <input type="text" id="titleInput" value="тут пишешь" maxlength="80">
      </div>
      <div class="group">
        <label>Подпись</label>
        <input type="text" id="subInput" value="и тут" maxlength="120">
      </div>
      <div class="group">
        <label>Размер заголовка: <span id="titleSizeVal">42</span>px</label>
        <input type="range" id="titleSize" min="16" max="90" value="42">
      </div>
      <div class="group">
        <label>Размер подписи: <span id="subSizeVal">22</span>px</label>
        <input type="range" id="subSize" min="10" max="60" value="22">
      </div>
      <div class="group">
        <label>Шрифт</label>
        <select id="fontSelect">
          <option value="'Bebas Neue', sans-serif">Bebas Neue</option>
          <option value="'Oswald', sans-serif">Oswald</option>
          <option value="'Montserrat', sans-serif">Montserrat</option>
          <option value="'Roboto', sans-serif" selected>Roboto</option>
          <option value="'Lobster', cursive">Lobster</option>
          <option value="'Playfair Display', serif">Playfair Display</option>
          <option value="Impact, sans-serif">Impact (классика)</option>
        </select>
      </div>
    </div>

    <div class="tab-content" id="tab-style">
      <div class="group">
        <label>Рамка вокруг картинки</label>
        <select id="frameSelect">
          <option value="classic">Классическая белая</option>
          <option value="double">Двойная</option>
          <option value="gold">Золотая</option>
          <option value="corners">Уголки</option>
          <option value="none">Без рамки</option>
        </select>
      </div>
      <div class="group">
        <label>Толщина рамки: <span id="frameWidthVal">3</span>px</label>
        <input type="range" id="frameWidth" min="1" max="20" value="3">
      </div>
      <div class="group">
        <label>Отступы демотиватора: <span id="padVal">40</span>px</label>
        <input type="range" id="paddingRange" min="10" max="100" value="40">
      </div>
      <div class="group">
        <label>Цвет фона</label>
        <select id="bgColor">
          <option value="#000000" selected>Чёрный (классика)</option>
          <option value="#1a1a1a">Тёмно-серый</option>
          <option value="#2c0b0b">Тёмно-красный</option>
          <option value="#0b1f2c">Тёмно-синий</option>
        </select>
      </div>
    </div>

    <div class="group" style="margin-top: 20px;">
      <button class="btn btn-accent" id="downloadBtn" disabled>⬇️ Скачать PNG</button>
    </div>
  </div>

  <div class="panel preview-wrap">
    <h2 style="align-self: flex-start;">Превью</h2>
    <div class="preview-container" id="previewContainer">
      <div id="demotivator">
        <div class="empty-state" id="emptyState">
          <div class="icon">🖼️</div>
          <div>Загрузи картинку, чтобы начать</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== FAVICON =====
(function(){
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,64,64);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.strokeRect(8,8,48,48);
  ctx.fillStyle = '#ff4757';
  ctx.font = 'bold 36px Impact, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('D', 32, 34);
  document.getElementById('favicon').href = c.toDataURL('image/png');
})();

// ===== STATE =====
const state = {
  originalImg: null,
  croppedImg: null,
  title: 'КОГДА ЗАКАЗ ПРИШЁЛ',
  sub: 'а ты уже поел',
  titleSize: 42,
  subSize: 22,
  font: "'Roboto', sans-serif",
  frame: 'classic',
  frameWidth: 3,
  padding: 40,
  bgColor: '#000000'
};

const $ = id => document.getElementById(id);
const fileInput = $('fileInput');
const fileDrop = $('fileDrop');
const demotivator = $('demotivator');
const openCropBtn = $('openCropBtn');
const cropModal = $('cropModal');
const cropImg = $('cropImg');
const cropBox = $('cropBox');
const downloadBtn = $('downloadBtn');

// ===== TABS =====
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    $('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// ===== FILE UPLOAD =====
fileDrop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) loadImage(f);
});
['dragover','dragenter'].forEach(ev => fileDrop.addEventListener(ev, e => {
  e.preventDefault(); fileDrop.classList.add('drag');
}));
['dragleave','drop'].forEach(ev => fileDrop.addEventListener(ev, e => {
  e.preventDefault(); fileDrop.classList.remove('drag');
}));
fileDrop.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadImage(f);
});

function loadImage(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      state.originalImg = img;
      state.croppedImg = null;
      openCropBtn.disabled = false;
      downloadBtn.disabled = false;
      render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ===== RENDER =====
function render() {
  if (!state.originalImg) return;
  const src = state.croppedImg || state.originalImg.src;
  
  demotivator.innerHTML = '';
  demotivator.style.background = state.bgColor;
  demotivator.style.padding = `${state.padding}px ${state.padding}px ${state.padding + 10}px`;
  
  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.style.position = 'relative';
  frame.style.display = 'inline-block';
  frame.style.lineHeight = '0';
  
  // Reset frame styles
  frame.style.border = 'none';
  frame.style.padding = '0';
  frame.style.background = 'transparent';
  frame.style.outline = 'none';
  frame.style.boxShadow = 'none';
  
  const img = document.createElement('img');
  img.src = src;
  img.crossOrigin = 'anonymous';
  
  const fw = state.frameWidth;
  
  if (state.frame === 'classic') {
    frame.style.border = `${fw}px solid #fff`;
    frame.appendChild(img);
  } else if (state.frame === 'double') {
    // Внешний слой — белая рамка, внутренний отступ — цвет фона, потом ещё одна белая рамка у картинки
    frame.style.border = `${fw}px solid ${state.bgColor}`;
    frame.style.background = '#fff';
    frame.style.padding = `${fw}px`;
    frame.appendChild(img);
    // Дополнительная внешняя обводка через outline
    frame.style.outline = `${fw}px solid #fff`;
  } else if (state.frame === 'gold') {
    frame.style.border = `${fw}px solid #d4af37`;
    frame.style.background = state.bgColor;
    frame.style.padding = '0';
    frame.style.boxShadow = `0 0 0 ${fw}px ${state.bgColor}, 0 0 0 ${fw*2}px #b8941f`;
    frame.appendChild(img);
  } else if (state.frame === 'corners') {
    frame.style.padding = `${fw * 3}px`;
    frame.style.background = 'transparent';
    frame.appendChild(img);
    // Уголки через псевдоэлементы не работают с inline style, используем 4 div
    const cs = Math.max(24, fw * 8);
    const corners = [
      { top: '0', left: '0', borderTop: `${fw}px solid #fff`, borderLeft: `${fw}px solid #fff`, width: cs+'px', height: cs+'px' },
      { top: '0', right: '0', borderTop: `${fw}px solid #fff`, borderRight: `${fw}px solid #fff`, width: cs+'px', height: cs+'px' },
      { bottom: '0', left: '0', borderBottom: `${fw}px solid #fff`, borderLeft: `${fw}px solid #fff`, width: cs+'px', height: cs+'px' },
      { bottom: '0', right: '0', borderBottom: `${fw}px solid #fff`, borderRight: `${fw}px solid #fff`, width: cs+'px', height: cs+'px' }
    ];
    corners.forEach(c => {
      const d = document.createElement('div');
      d.style.position = 'absolute';
      Object.keys(c).forEach(k => { if (k !== 'width' && k !== 'height') d.style[k] = c[k]; });
      d.style.width = c.width;
      d.style.height = c.height;
      d.style.pointerEvents = 'none';
      frame.appendChild(d);
    });
  } else {
    frame.appendChild(img);
  }
  
  demotivator.appendChild(frame);
  
  if (state.title) {
    const t = document.createElement('div');
    t.className = 'dem-title';
    t.textContent = state.title;
    t.style.fontFamily = state.font;
    t.style.fontSize = state.titleSize + 'px';
    demotivator.appendChild(t);
  }
  if (state.sub) {
    const s = document.createElement('div');
    s.className = 'dem-sub';
    s.textContent = state.sub;
    s.style.fontFamily = state.font;
    s.style.fontSize = state.subSize + 'px';
    s.style.opacity = '0.9';
    demotivator.appendChild(s);
  }
}

// ===== INPUT BINDINGS =====
$('titleInput').addEventListener('input', e => { state.title = e.target.value; render(); });
$('subInput').addEventListener('input', e => { state.sub = e.target.value; render(); });
$('titleSize').addEventListener('input', e => {
  state.titleSize = +e.target.value;
  $('titleSizeVal').textContent = e.target.value;
  render();
});
$('subSize').addEventListener('input', e => {
  state.subSize = +e.target.value;
  $('subSizeVal').textContent = e.target.value;
  render();
});
$('fontSelect').addEventListener('change', e => { state.font = e.target.value; render(); });
$('frameSelect').addEventListener('change', e => { state.frame = e.target.value; render(); });
$('frameWidth').addEventListener('input', e => {
  state.frameWidth = +e.target.value;
  $('frameWidthVal').textContent = e.target.value;
  render();
});
$('paddingRange').addEventListener('input', e => {
  state.padding = +e.target.value;
  $('padVal').textContent = e.target.value;
  render();
});
$('bgColor').addEventListener('change', e => { state.bgColor = e.target.value; render(); });

// ===== CROP =====
let cropState = {
  x: 0, y: 0, w: 0, h: 0,
  imgW: 0, imgH: 0,
  scale: 1,
  dragging: null,
  startX: 0, startY: 0,
  origBox: null
};

openCropBtn.addEventListener('click', () => {
  if (!state.originalImg) return;
  cropModal.classList.add('active');
  const src = state.croppedImg || state.originalImg.src;
  cropImg.onload = () => initCropBox();
  cropImg.src = src;
});

$('closeCropBtn').addEventListener('click', () => cropModal.classList.remove('active'));

function initCropBox() {
  const rect = cropImg.getBoundingClientRect();
  cropState.imgW = rect.width;
  cropState.imgH = rect.height;
  cropState.scale = cropImg.naturalWidth / rect.width;
  const w = rect.width * 0.8;
  const h = rect.height * 0.8;
  cropState.x = (rect.width - w) / 2;
  cropState.y = (rect.height - h) / 2;
  cropState.w = w;
  cropState.h = h;
  updateCropBox();
}

function updateCropBox() {
  cropBox.style.left = cropState.x + 'px';
  cropBox.style.top = cropState.y + 'px';
  cropBox.style.width = cropState.w + 'px';
  cropBox.style.height = cropState.h + 'px';
}

function getPos(e) {
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function startDrag(e, handle) {
  e.preventDefault();
  const pos = getPos(e);
  cropState.dragging = handle || 'move';
  cropState.startX = pos.x;
  cropState.startY = pos.y;
  cropState.origBox = { x: cropState.x, y: cropState.y, w: cropState.w, h: cropState.h };
}

cropBox.addEventListener('mousedown', e => {
  if (e.target.classList.contains('handle')) return;
  startDrag(e, 'move');
});
cropBox.addEventListener('touchstart', e => {
  if (e.target.classList.contains('handle')) return;
  startDrag(e, 'move');
}, { passive: false });

document.querySelectorAll('.handle').forEach(h => {
  h.addEventListener('mousedown', e => { e.stopPropagation(); startDrag(e, h.dataset.handle); });
  h.addEventListener('touchstart', e => { e.stopPropagation(); startDrag(e, h.dataset.handle); }, { passive: false });
});

function onMove(e) {
  if (!cropState.dragging) return;
  e.preventDefault();
  const pos = getPos(e);
  const dx = pos.x - cropState.startX;
  const dy = pos.y - cropState.startY;
  const o = cropState.origBox;
  const minSize = 20;
  
  if (cropState.dragging === 'move') {
    cropState.x = Math.max(0, Math.min(cropState.imgW - cropState.w, o.x + dx));
    cropState.y = Math.max(0, Math.min(cropState.imgH - cropState.h, o.y + dy));
  } else {
    let nx = o.x, ny = o.y, nw = o.w, nh = o.h;
    if (cropState.dragging.includes('l')) { nx = o.x + dx; nw = o.w - dx; }
    if (cropState.dragging.includes('r')) { nw = o.w + dx; }
    if (cropState.dragging.includes('t')) { ny = o.y + dy; nh = o.h - dy; }
    if (cropState.dragging.includes('b')) { nh = o.h + dy; }
    if (nw < minSize) { if (cropState.dragging.includes('l')) nx = o.x + o.w - minSize; nw = minSize; }
    if (nh < minSize) { if (cropState.dragging.includes('t')) ny = o.y + o.h - minSize; nh = minSize; }
    nx = Math.max(0, nx);
    ny = Math.max(0, ny);
    if (nx + nw > cropState.imgW) nw = cropState.imgW - nx;
    if (ny + nh > cropState.imgH) nh = cropState.imgH - ny;
    cropState.x = nx; cropState.y = ny; cropState.w = nw; cropState.h = nh;
  }
  updateCropBox();
}

function endDrag() { cropState.dragging = null; } //z

document.addEventListener('mousemove', onMove);
document.addEventListener('touchmove', onMove, { passive: false });
document.addEventListener('mouseup', endDrag);
document.addEventListener('touchend', endDrag);

$('applyCropBtn').addEventListener('click', () => {
  const scale = cropState.scale;
  const sx = cropState.x * scale;
  const sy = cropState.y * scale;
  const sw = cropState.w * scale;
  const sh = cropState.h * scale;
  const canvas = document.createElement('canvas');
  canvas.width = sw; canvas.height = sh;
  const ctx = canvas.getContext('2d');
  const srcImg = new Image();
  srcImg.onload = () => {
    ctx.drawImage(srcImg, sx, sy, sw, sh, 0, 0, sw, sh);
    state.croppedImg = canvas.toDataURL('image/png');
    cropModal.classList.remove('active');
    render();
  };
  srcImg.src = cropImg.src;
});

$('resetCropBtn').addEventListener('click', () => {
  state.croppedImg = null;
  cropModal.classList.remove('active');
  render();
});

// ===== DOWNLOAD =====
downloadBtn.addEventListener('click', async () => {
  if (!state.originalImg) return;
  await document.fonts.ready;
  
  const src = state.croppedImg || state.originalImg.src;
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.crossOrigin = 'anonymous';
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = src;
  });
  
  const fw = state.frameWidth;
  
  // Масштабируем картинку до разумной ширины
  const maxW = 1200;
  let drawW = img.width;
  let drawH = img.height;
  if (drawW > maxW) {
    drawH = drawH * (maxW / drawW);
    drawW = maxW;
  }
  
  // Получаем текущий размер картинки в превью для пропорционального масштабирования текста
  const previewFrame = demotivator.querySelector('.frame');
  const previewImg = previewFrame ? previewFrame.querySelector('img') : null;
  const previewImgW = previewImg ? previewImg.getBoundingClientRect().width : drawW;
  const textScale = drawW / previewImgW;
  
  const titleSize = Math.round(state.titleSize * textScale);
  const subSize = Math.round(state.subSize * textScale);
  const padScaled = Math.round(state.padding * textScale);
  const fwScaled = Math.round(fw * textScale);
  
  // Измеряем текст
  const tmpCanvas = document.createElement('canvas');
  const tmpCtx = tmpCanvas.getContext('2d');
  
  tmpCtx.font = `bold ${titleSize}px ${state.font}`;
  const titleH = state.title ? titleSize * 1.2 : 0;
  tmpCtx.font = `${subSize}px ${state.font}`;
  const subH = state.sub ? subSize * 1.3 : 0;
  
  // Вычисляем размеры рамки в экспорте
  let frameOuterPad = 0; // дополнительный отступ снаружи рамки
  if (state.frame === 'classic') {
    frameOuterPad = fwScaled;
  } else if (state.frame === 'double') {
    // padding (fw) + border (fw) + outline (fw)
    frameOuterPad = fwScaled * 3;
  } else if (state.frame === 'gold') {
    // border (fw) + gap (fw) + outer ring (fw)
    frameOuterPad = fwScaled * 3;
  } else if (state.frame === 'corners') {
    frameOuterPad = fwScaled * 3;
  }
  
  const imgX = padScaled + frameOuterPad;
  const imgY = padScaled + frameOuterPad;
  
  const canvasW = imgX + drawW + frameOuterPad + padScaled;
  const canvasH = imgY + drawH + frameOuterPad + (state.title ? 18 * textScale : 0) + titleH + (state.sub ? 8 * textScale : 0) + subH + padScaled;
  
  const canvas = document.createElement('canvas');
  canvas.width = canvasW;
  canvas.height = canvasH;
  const ctx = canvas.getContext('2d');
  
  // Фон
  ctx.fillStyle = state.bgColor;
  ctx.fillRect(0, 0, canvasW, canvasH);
  
  // Рамка
  if (state.frame === 'classic') {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = fwScaled;
    ctx.strokeRect(imgX, imgY, drawW, drawH);
  } else if (state.frame === 'double') {
    // Внешняя белая зона (padding frame)
    ctx.fillStyle = '#fff';
    ctx.fillRect(imgX - fwScaled*2, imgY - fwScaled*2, drawW + fwScaled*4, drawH + fwScaled*4);
    // Внутренний цветной отступ
    ctx.fillStyle = state.bgColor;
    ctx.fillRect(imgX - fwScaled, imgY - fwScaled, drawW + fwScaled*2, drawH + fwScaled*2);
    // Внешняя обводка
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = fwScaled;
    ctx.strokeRect(imgX - fwScaled*2.5, imgY - fwScaled*2.5, drawW + fwScaled*5, drawH + fwScaled*5);
  } else if (state.frame === 'gold') {
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = fwScaled;
    ctx.strokeRect(imgX, imgY, drawW, drawH);
    ctx.strokeStyle = '#b8941f';
    ctx.strokeRect(imgX - fwScaled*2, imgY - fwScaled*2, drawW + fwScaled*4, drawH + fwScaled*4);
  } else if (state.frame === 'corners') {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = fwScaled;
    const cs = Math.max(24 * textScale, fwScaled * 8);
    ctx.beginPath(); ctx.moveTo(imgX, imgY + cs); ctx.lineTo(imgX, imgY); ctx.lineTo(imgX + cs, imgY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(imgX + drawW - cs, imgY); ctx.lineTo(imgX + drawW, imgY); ctx.lineTo(imgX + drawW, imgY + cs); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(imgX, imgY + drawH - cs); ctx.lineTo(imgX, imgY + drawH); ctx.lineTo(imgX + cs, imgY + drawH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(imgX + drawW - cs, imgY + drawH); ctx.lineTo(imgX + drawW, imgY + drawH); ctx.lineTo(imgX + drawW, imgY + drawH - cs); ctx.stroke();
  }
  
  // Картинка
  ctx.drawImage(img, imgX, imgY, drawW, drawH);
  
  // Текст
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  const centerX = canvasW / 2;
  let curY = imgY + drawH + frameOuterPad + 18 * textScale;
  
  if (state.title) {
    ctx.font = `bold ${titleSize}px ${state.font}`;
    ctx.fillText(state.title, centerX, curY + titleSize * 0.85);
    curY += titleH;
  }
  if (state.sub) {
    curY += 8 * textScale;
    ctx.font = `${subSize}px ${state.font}`;
    ctx.globalAlpha = 0.9;
    ctx.fillText(state.sub, centerX, curY + subSize * 0.85);
    ctx.globalAlpha = 1;
  }
  
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'demotivator.png';
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
});

render();
</script>
